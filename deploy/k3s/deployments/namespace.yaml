apiVersion: v1
kind: Namespace
metadata:
  name: nova-deployments
  labels:
    app.kubernetes.io/part-of: nova-constellation
    nova.dlxstudios.com/runtime-boundary: deployment
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: deployment-default-quota
  namespace: nova-deployments
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: deployment-default-limits
  namespace: nova-deployments
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: "1"
        memory: 512Mi
