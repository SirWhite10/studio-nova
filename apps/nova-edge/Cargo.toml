[workspace]
resolver = "2"
members = [
  "crates/nova-edge",
  "crates/edge-api",
  "crates/edge-tls",
  "crates/edge-proxy",
  "crates/edge-tunnel",
  "crates/edge-store",
  "crates/edge-analytics",
  "crates/edge-dns",
  "crates/edge-config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://forgejo.dlxstudios.com/dlxstudios/studio-nova"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "compression-gzip"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-acme = "0.15"
rustls-pemfile = "2"
pem = "3"
rcgen = "0.13"

# Hyper utilities
hyper-util = { version = "0.1", features = ["tokio", "service"] }

# Database
surrealdb = { version = "=3.1.2", features = ["protocol-ws", "protocol-http"] }
clickhouse = "0.15"

# Tunnel transport
yamux = "0.13"

# DNS
hickory-resolver = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.28"
opentelemetry-sdk = { version = "0.28", package = "opentelemetry_sdk" }
opentelemetry-otlp = "0.28"
tracing-opentelemetry = "0.29"

# Concurrency
dashmap = "6"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP client (for webhooks)
reqwest = { version = "0.13", features = ["json"] }

# Crypto
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"

# Async trait
async-trait = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Rate limiting
governor = "0.10"

# Bytes
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
httparse = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Compression
flate2 = "1"

# Hex encoding
hex = "0.4"

# Testing
tempfile = "3"
