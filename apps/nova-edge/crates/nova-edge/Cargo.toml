[package]
name = "nova-edge"
description = "Unified Rust edge service — TLS, admin API, tunnel, analytics"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nova-edge"
path = "src/main.rs"

[dependencies]
edge-api = { path = "../edge-api" }
edge-tls = { path = "../edge-tls" }
edge-proxy = { path = "../edge-proxy" }
edge-tunnel = { path = "../edge-tunnel" }
edge-store = { path = "../edge-store" }
edge-analytics = { path = "../edge-analytics" }
edge-config = { path = "../edge-config" }
edge-dns = { path = "../edge-dns" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
